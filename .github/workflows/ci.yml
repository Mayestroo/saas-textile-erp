name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  verify:
    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: textile_admin
          POSTGRES_PASSWORD: textile_test_password
          POSTGRES_DB: textile_master_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.2.9
        ports:
          - 6379:6379

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
